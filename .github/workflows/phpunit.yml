on:
    pull_request: null
    push:
        branches:
          - 'master'

name: phpunit

jobs:
    phpunit:
        uses: spiral/gh-actions/.github/workflows/phpunit.yml@e966c298913edde0d254c9afdbb07a7f4f3d3acc # master
        with:
            os: >-
                ['ubuntu-latest']
            php: >-
                ['8.1', '8.2', '8.3', '8.4', '8.5']
            stability: >-
                ['prefer-lowest', 'prefer-stable']
